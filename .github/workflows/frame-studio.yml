name: Vos Frame Studio
on:
  push:
    branches: [main, codex/vos-frame-studio]
    paths: [frame_studio/**, colab/**, docs/VOS_WAN22_COLAB.md, Dockerfile, .dockerignore, render.yaml, .github/workflows/frame-studio.yml]
  pull_request:
    paths: [frame_studio/**, colab/**, docs/VOS_WAN22_COLAB.md, Dockerfile, .dockerignore, render.yaml, .github/workflows/frame-studio.yml]
permissions:
  contents: read
jobs:
  docker-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validar notebook Colab e sintaxe Python (sem GPU)
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          notebook=Path("colab/VOS_Wan22_Animate_Replacement.ipynb")
          data=json.loads(notebook.read_text(encoding="utf-8"))
          assert data["nbformat"]==4
          code=[]
          for i,cell in enumerate(data["cells"]):
              if cell["cell_type"]=="code":
                  source="".join(cell["source"])
                  compile(source,str(notebook)+f":cell:{i}","exec")
                  code.append(source)
          combined="\n".join(code)
          assert "'prepare'" in combined
          assert "'preprocess'" in combined
          assert "'infer'" in combined
          assert "'finish'" in combined
          assert "modelscope" in combined
          assert "if vram<32 or ram<24 or disk<85" in combined
          print("Notebook válido:",len(code),"células Python compiladas")
          PY
      - name: Testar o extrator, importador e montador no Docker
        run: docker build --target test -t vos-frame-studio:test .
      - name: Construir e verificar o serviço de produção
        run: |
          docker build --target production -t vos-frame-studio .
          docker run -d --name vos-check --memory=512m --cpus=1 -p 10000:10000 vos-frame-studio
          for attempt in $(seq 1 30); do
            if curl --fail http://localhost:10000/healthz; then exit 0; fi
            sleep 1
          done
          docker logs vos-check
          exit 1
